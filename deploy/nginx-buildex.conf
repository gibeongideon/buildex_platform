# Buildex Connect — reverse proxy.
#
# Two entry points on purpose:
#   · https://buildexconnect.dibon.co.ke  — the real address, TLS, HSTS
#   · http://143.244.137.254              — the bare IP, kept working for demos
#
# A certificate cannot be issued for an IP address, so the IP is served over
# plain HTTP from the catch-all block. That means the domain block must NOT be
# the default server, or the IP would inherit its redirect to a hostname it does
# not have a cert for.

upstream buildex_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- The bare IP, and anything else that resolves here over HTTP -------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let certbot answer challenges even on the catch-all.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://buildex_app;
        include /etc/nginx/snippets/buildex-proxy.conf;
    }
}

# --- The domain over HTTP: redirect to HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name buildexconnect.dibon.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- The domain over HTTPS ---------------------------------------------------
server {
    # `http2 on;` needs nginx 1.25.1+; Ubuntu 24.04 ships 1.24, so HTTP/2 is
    # enabled on the listen directive instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buildexconnect.dibon.co.ke;

    ssl_certificate     /etc/letsencrypt/live/buildexconnect.dibon.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildexconnect.dibon.co.ke/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BuildexSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Only sent over HTTPS, so the IP-over-HTTP entry point is unaffected.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://buildex_app;
        include /etc/nginx/snippets/buildex-proxy.conf;
    }
}
